CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

CONFIG_GPIO=y

CONFIG_ASSERT=y

# ---------------------------------------------------------------------------
# Z-003/Z-004 authority lock
# ---------------------------------------------------------------------------

CONFIG_AMS_BMS_AUTHORITY=n
CONFIG_AMS_BALANCE_AUTHORITY=n
CONFIG_AMS_IMD_TARGET_VALIDATED=n

# ---------------------------------------------------------------------------
# Z-004 static runtime diagnostics
# ---------------------------------------------------------------------------

CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y

# No application heap is required by the AMS runtime skeleton.
CONFIG_HEAP_MEM_POOL_SIZE=0

# ---------------------------------------------------------------------------
# Z-011 current ADC adapter
# ---------------------------------------------------------------------------

CONFIG_ADC=y
CONFIG_ADC_ASYNC=y
CONFIG_ADC_STM32_DMA=n

# ---------------------------------------------------------------------------
# Z-012 fan PWM adapter
# ---------------------------------------------------------------------------

CONFIG_PWM=y

# ---------------------------------------------------------------------------
# Z-013 IMD PWM-input capture
# ---------------------------------------------------------------------------

CONFIG_PWM_CAPTURE=y
