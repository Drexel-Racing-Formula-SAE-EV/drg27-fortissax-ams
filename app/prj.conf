CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

CONFIG_GPIO=y

# ---------------------------------------------------------------------------
# Z-015 private bounded ADBMS SPI6 transport
# ---------------------------------------------------------------------------
# SPI6 is deliberately NOT owned by Zephyr's generic spi_stm32 driver. The
# hidden AMS_ADBMS_SPI_PRIVATE_BACKEND selects only STM32 LL SPI support and
# the reset-controller API used by the private polling/recovery backend.
CONFIG_SPI=n
CONFIG_SPI_ASYNC=n
CONFIG_SPI_RTIO=n
CONFIG_SPI_STM32_DMA=n

CONFIG_ASSERT=y

# ---------------------------------------------------------------------------
# Z-003/Z-004 authority lock
# ---------------------------------------------------------------------------

CONFIG_AMS_BMS_AUTHORITY=n
CONFIG_AMS_BALANCE_AUTHORITY=n
CONFIG_AMS_IMD_TARGET_VALIDATED=n

# ---------------------------------------------------------------------------
# Z-004 static runtime diagnostics
# ---------------------------------------------------------------------------

CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y

# No application heap is required by the AMS runtime skeleton.
CONFIG_HEAP_MEM_POOL_SIZE=0

# ---------------------------------------------------------------------------
# Z-011 current ADC adapter
# ---------------------------------------------------------------------------

CONFIG_ADC=y
CONFIG_ADC_ASYNC=y
CONFIG_ADC_STM32_DMA=n

# ---------------------------------------------------------------------------
# Z-012 fan PWM adapter
# ---------------------------------------------------------------------------

CONFIG_PWM=y

# ---------------------------------------------------------------------------
# Z-013 IMD PWM-input capture
# ---------------------------------------------------------------------------

CONFIG_PWM_CAPTURE=y


# ---------------------------------------------------------------------------
# Z-014 watchdog adapter (prepared in base build, armed only by validation cfg)
# ---------------------------------------------------------------------------

CONFIG_WATCHDOG=y
CONFIG_HWINFO=y
CONFIG_AMS_IWDG_VALIDATION_MODE=n
